<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo | Blog Tasty Pastries</title>
  <meta name="description" content="Ideas, recetas y conocimiento gastronómico de Tasty Pastries.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#F4EBDD;--chocolate:#563B30;--caramel:#A87853;--olive:#899078}
    *{box-sizing:border-box}body{margin:0;background:#fbf8f2;color:var(--chocolate);font-family:Lato,Arial,sans-serif;line-height:1.75}
    h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.2}.wrap{width:min(820px,calc(100% - 36px));margin:auto}
    header{background:var(--cream);padding:22px 0;border-bottom:1px solid #a8785333}.nav{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.nav a{color:var(--caramel);font-weight:700;text-decoration:none}
    main{padding:48px 0 70px}.eyebrow{font-size:.75rem;color:var(--caramel);font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    h1{font-size:clamp(2.3rem,6vw,3.7rem);margin:12px 0}.summary{font-size:1.15rem;color:#766d64}
    .hero-image{width:100%;max-height:480px;object-fit:cover;border-radius:16px;margin:28px 0;background:var(--cream)}
    .meta{font-size:.84rem;color:var(--olive);margin:14px 0 22px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#f1e5d7;border-radius:999px;padding:5px 11px;font-size:.75rem}
    .content h2{margin-top:2.2em;font-size:1.8rem}.content h3{font-size:1.3rem}.content p,.content li{color:#51463f}
    .content img{max-width:100%;height:auto;border-radius:12px}.recipe-data{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.recipe-data span{padding:10px 13px;background:#fff;border:1px solid #a8785333;border-radius:9px;font-size:.86rem}
    .notice{margin-top:40px;padding:22px;background:var(--cream);border-radius:14px}.notice a{color:var(--caramel);font-weight:700}
    .not-found{text-align:center;padding:70px 0}.not-found a{color:var(--caramel)}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a href="../">← Blog Tasty Pastries</a><a href="../../">Ir a la tienda</a></div></header>
  <main class="wrap" id="article"><div class="not-found"><p class="eyebrow">Blog Tasty Pastries</p><h1>Abriendo el cuaderno de ideas…</h1></div></main>
  <script>
    const params=new URLSearchParams(location.search);const slug=params.get('slug');
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('../data/publicaciones.json').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(data=>{
      const post=(data.publicaciones||[]).find(item=>item.slug===slug);
      if(!post)throw new Error('not-found');
      document.title=post.titulo+' | Blog Tasty Pastries';
      const image=post.imagen?'<img class="hero-image" src="../../'+esc(post.imagen)+'" alt="'+esc(post.imagen_alt||post.titulo)+'">':'';
      const tags=(post.etiquetas||[]).map(tag=>'<span class="tag">'+esc(tag.replaceAll('-',' '))+'</span>').join('');
      const meta=[post.fecha_publicacion,post.tiempo_lectura?post.tiempo_lectura+' min de lectura':''].filter(Boolean).join(' · ');
      let body=post.contenido_html||'<p>El contenido de este artículo se está preparando.</p>';
      document.getElementById('article').innerHTML='<p class="eyebrow">'+esc(post.categoria_label||post.categoria)+'</p><h1>'+esc(post.titulo)+'</h1><p class="summary">'+esc(post.resumen)+'</p><div class="meta">'+esc(meta)+'</div><div class="tags">'+tags+'</div>'+image+'<article class="content">'+body+'</article>'+(post.nota?'<aside class="notice">'+esc(post.nota)+'</aside>':'')+'<aside class="notice"><strong>Conoce Tasty Pastries</strong><p>Repostería artesanal elaborada por encargo en Caracas.</p><a href="../../#catalogo">Explorar nuestra propuesta →</a></aside>';
    }).catch(()=>{document.getElementById('article').innerHTML='<div class="not-found"><p class="eyebrow">Blog Tasty Pastries</p><h1>Este artículo todavía no está disponible</h1><p>Puede que el enlace no sea correcto o que la publicación esté en preparación.</p><a href="../">Volver al blog</a></div>';});
  </script>
</body>
</html>
